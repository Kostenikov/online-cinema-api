[tool.poetry]
name = "fastapi-online-cinema"
version = "0.1.0"
description = "FastAPI Online Cinema Project"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.119.0"
sqlalchemy = "^2.0.44"
pytest = "^8.4.2"
pydantic-settings = "^2.11.0"
pandas = "^2.3.3"
tqdm = "^4.67.1"
uvicorn = "^0.37.0"
httpx = "^0.28.1"
pytest-env = "^1.2.0"
flake8 = "^7.3.0"
psycopg2-binary = "^2.9.11"
alembic = "^1.17.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-jose = { extras = ["cryptography"], version = "^3.5.0" }
email-validator = "^2.3.0"
bcrypt = "4.0.1"
jinja2 = "^3.1.6"
pytest-order = "^1.3.0"
beautifulsoup4 = "^4.14.2"
validators = "^0.35.0"
botocore = "^1.40.18"
pillow = "^11.3.0"
python-multipart = "^0.0.20"
aiosmtplib = "^4.0.2"
asyncpg = "^0.30.0"
aiosqlite = "^0.21.0"
aioboto3 = "^15.2.0"
pytest-asyncio = "^1.2.0"
gunicorn = "^23.0.0"
black = "^25.9.0"
isort = "^7.0.0"
mypy = "^1.18.2"
async-timeout = "^5.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ["py312"]
exclude = '''
(
  \.venv
  | venv
  | src/database/migrations/versions
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3
force_grid_wrap = 0
include_trailing_comma = true
line_length = 119
skip_gitignore = true
skip = ["src/database/migrations/"]

[tool.mypy]
python_version = "3.12"
plugins = []
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
strict_optional = true
show_error_codes = true
pretty = true
exclude = [
    ".venv",
    "venv",
    "src/tests/*",
    "src/database/migrations/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["src/tests"]
env = ["ENVIRONMENT=testing"]
